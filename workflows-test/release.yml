# gxbackend_rust 静态库三平台预编译发布。
#
# 背景：libgxbackend_rust 由 Rust crate（依赖 wgpu/glyphon/cosmic-text）
# 编译成 C 静态库（crate-type = staticlib），Go 侧 rust/go 通过
#   #cgo ... -L${SRCDIR}/../rust/target/release -lgxbackend_rust
# 消费。此前各平台（尤其 Windows CI / 本地）都要自己 cargo build，
# Windows 上 wgpu 的 windows-gnu 编译成本极高。
#
# 本工作流把三平台的静态库预编译并发布到 GitHub Release（rolling tag
# rust-prebuilt），消费方只需：
#   curl -L <release asset> | tar xz -C <gox-backend checkout>
# 解包后按 rust/rust/target/release/libgxbackend_rust.a 原路径落位，
# #cgo 配置零改动即可链接。
#
# 触发：手动 workflow_dispatch（滚动更新 rust-prebuilt release）或推
# rust-v* tag（正式版本发布）。Windows 用 x86_64-pc-windows-gnu 目标
# （rustup 自带 rust-mingw 链接组件），产物与 cgo/mingw 完美兼容。
name: Release gxbackend_rust 静态库

on:
  workflow_dispatch:
  push:
    tags: ['rust-v*']

permissions:
  contents: write

jobs:
  build:
    name: 编译（${{ matrix.platform }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/rust

      - name: 编译静态库
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: rust/rust

      # 产物统一按 rust/rust/target/release/libgxbackend_rust.a 落位打包，
      # 消费方解包到 gox-backend 检出目录顶层即可（tar 自带相对路径）。
      - name: 打包
        shell: bash
        run: |
          LIBDIR="rust/rust/target/${{ matrix.target }}/release"
          ls -la "$LIBDIR" | grep gxbackend
          tar czf "gxbackend-rust-${{ matrix.platform }}.tar.gz" -C "$LIBDIR" libgxbackend_rust.a
          ls -la gxbackend-rust-*.tar.gz

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gxbackend-rust-${{ matrix.platform }}
          path: gxbackend-rust-*.tar.gz

  release:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布（滚动 rust-prebuilt / tag 版本）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/rust-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" dist/* --title "$TAG" --notes "gxbackend_rust 三平台预编译静态库（${TAG}）" --repo "$GITHUB_REPOSITORY"
          else
            # 手动触发：滚动更新 rust-prebuilt，旧资源 --clobber 覆盖
            gh release view rust-prebuilt --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create rust-prebuilt --title "gxbackend_rust 预编译静态库（滚动更新）" \
                   --notes "三平台 libgxbackend_rust 静态库。解包：tar xz -C <gox-backend 检出目录>，按 rust/rust/target/release/ 原路径落位。" \
                   --repo "$GITHUB_REPOSITORY"
            gh release upload rust-prebuilt dist/* --clobber --repo "$GITHUB_REPOSITORY"
          fi
          gh release view rust-prebuilt --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
